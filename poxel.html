<html>

        <title>poxel grid</title>
        <link rel="stylesheet" href="style.css">

    <body>
       <header class="flex">
            <div class="flex">
                <svg focusable="false" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2M8 20H4v-4h4zm0-6H4v-4h4zm0-6H4V4h4zm6 12h-4v-4h4zm0-6h-4v-4h4zm0-6h-4V4h4zm6 12h-4v-4h4zm0-6h-4v-4h4zm0-6h-4V4h4z"></path></svg><p>Poxel</p>

        <main class="flex editor">
            <section class="instruments flex vertical">
                <p><input type="color" id="foreground" name="foreground" value='#e2139a'/></p>

                <p><img id="eraser" class="tool" src="src/eraser.svg"></p>
                <p><img id="fill" class="tool" src="src/fill.svg"></p>
                <p><img id="trash" class="tool" src="src/delete.svg"></p>

                <p><img id="download" class="tool" src="src/download.svg"></p>

            <section class="grid">
                
            </section>
